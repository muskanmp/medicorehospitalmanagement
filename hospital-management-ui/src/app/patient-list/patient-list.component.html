<p-card header="Recent Appointments">
    <button pButton label="Add Patient" icon="pi pi-plus" class="p-button-success" (click)="addPatient()"></button>

<p-table [value]="patients">

<ng-template pTemplate="header">
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Actions</th>
</tr>
</ng-template>

<ng-template pTemplate="body" let-p>
<tr>
<td>{{p.name}}</td>
<td>{{p.email}}</td>
<td>{{p.phone}}</td>
<td>
  <button pButton label="Edit" icon="pi pi-pencil" class="p-button-warning"></button>
  <button pButton label="Delete" icon="pi pi-trash" class="p-button-danger"></button>
</td>
</tr>
</ng-template>

</p-table>
</p-card>
